services:
  prometheus:
    image: prom/prometheus:latest
    container_name: udalovrm-netology-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./6-04/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    restart: unless-stopped
    networks:
      udalovrm-my-netology-hw:
        ipv4_address: 10.5.0.10

  pushgateway:
    image: prom/pushgateway:latest
    container_name: udalovrm-netology-pushgateway
    ports:
      - "9091:9091"
    restart: unless-stopped
    networks:
      udalovrm-my-netology-hw:
        ipv4_address: 10.5.0.11

  grafana:
    image: grafana/grafana:latest
    container_name: udalovrm-netology-grafana
    ports:
      - "80:3000"
    environment:
      - GF_PATHS_CONFIG=/etc/grafana/grafana.ini
    volumes:
      - type: bind
        source: ./6-04/grafana/custom.ini
        target: /etc/grafana/grafana.ini
      - grafana_data:/var/lib/grafana
      - grafana_logs:/var/log/grafana
      - grafana_plugins:/var/lib/grafana/plugins
    restart: unless-stopped
    networks:
      udalovrm-my-netology-hw:
        ipv4_address: 10.5.0.12

networks:
  udalovrm-my-netology-hw:
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.0.0/16

volumes:
  prometheus_data:
  grafana_data:
  grafana_logs:
  grafana_plugins:
